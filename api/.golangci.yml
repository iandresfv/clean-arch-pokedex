version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    # Correctness
    - bodyclose        # HTTP response bodies must be closed or connections leak
    - errorlint        # enforces errors.Is/As over == and type assertions
    - nilerr           # returning nil after checking err != nil
    - rowserrcheck     # rows.Err() must be checked after iterating
    - sqlclosecheck    # sql.Rows/Stmt must be closed
    - noctx            # HTTP requests without a context cannot be cancelled
    - contextcheck     # detects context.Background() where a ctx is available
    # Security
    - gosec
    # Style and maintainability
    - revive
    - misspell
    - unconvert
    - wastedassign
    - godot            # comments end in a period
    - goconst

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    govet:
      enable-all: true
      disable:
        - fieldalignment  # readability of config structs beats byte packing here
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: package-comments
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: indent-error-flow
        - name: unreachable-code
        - name: redefines-builtin-id
    gosec:
      excludes:
        # Integer conversions are audited by hand where they cross the SQL
        # boundary; the linter cannot see the CHECK constraints that bound them.
        - G115
    staticcheck:
      checks:
        - all

  exclusions:
    generated: lax
    rules:
      # Generated by sqlc; style rules do not apply to code we do not write.
      - path: internal/repository/postgres/(db|models|.*\.sql)\.go
        linters:
          - revive
          - godot
          - errcheck
          - staticcheck
      # Tests favour readability: long table literals and unchecked helper
      # errors are idiomatic there.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - goconst
          - contextcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/iandresfv/clean-arch-pokedex/api

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
