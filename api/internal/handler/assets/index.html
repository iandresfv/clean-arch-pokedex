<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pokedex API — Reference</title>
    <!-- Served from this binary, never a CDN: the documentation stays available
         offline and does not depend on a third party being reachable. -->
    <link rel="stylesheet" href="/docs/swagger-ui.css" />
    <style>
      body {
        margin: 0;
        background: #fafafa;
      }
      .topbar {
        display: none;
      }
      .swagger-ui .info {
        margin: 30px 0;
      }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="/docs/swagger-ui-bundle.js"></script>
    <script>
      window.onload = function () {
        window.ui = SwaggerUIBundle({
          url: '/docs/openapi.yaml',
          dom_id: '#swagger-ui',
          deepLinking: true,
          docExpansion: 'list',
          defaultModelsExpandDepth: 1,
          tryItOutEnabled: true,
          presets: [SwaggerUIBundle.presets.apis],
        });
      };
    </script>
  </body>
</html>
