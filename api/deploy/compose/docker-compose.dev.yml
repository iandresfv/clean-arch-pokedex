name: pokedex-dev

# Development stack: source is bind-mounted and Air rebuilds on save.
#
# This, not Kubernetes, is the day-to-day loop. It starts in seconds and needs
# no manifests. The Kubernetes stack under deploy/k8s exists for the concerns
# that only appear there: probes, rollouts, resource limits and replicas.

services:
  postgres:
    image: postgres:18-alpine
    container_name: pokedex-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-pokedex}
      # Deterministic collation: without it the image inherits the host locale
      # and ORDER BY on text columns differs between machines.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18 moved PGDATA to a version-specific subdirectory
      # (/var/lib/postgresql/18/docker). Mounting the pre-18 path
      # (/var/lib/postgresql/data) silently persists nothing.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-pokedex}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [pokedex-dev]

  migrate:
    image: migrate/migrate:v4.19.0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../migrations:/migrations:ro
    command:
      - '-path=/migrations'
      - '-database=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-pokedex}?sslmode=disable'
      - 'up'
    restart: on-failure
    networks: [pokedex-dev]

  api:
    build:
      context: ../..
      dockerfile: Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-pokedex}
      LOG_LEVEL: debug
      LOG_FORMAT: text
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - '${SERVER_PORT:-8080}:8080'
    volumes:
      - ../..:/app
      # Anonymous volumes keep container-only build artefacts out of the host
      # tree, where they would confuse the local toolchain.
      - /app/tmp
      - /app/bin
    networks: [pokedex-dev]

  # Present so the Compose stack matches the Kubernetes one, but disabled in the
  # API by default: a single instance has no state to share.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'no', '--save', '', '--maxmemory', '64mb', '--maxmemory-policy', 'allkeys-lru']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [pokedex-dev]

volumes:
  postgres_data:
    name: pokedex_postgres_data_dev

networks:
  pokedex-dev:
    name: pokedex-dev
    driver: bridge
