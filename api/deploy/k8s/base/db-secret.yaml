apiVersion: v1
kind: Secret
metadata:
  name: pokedex-db
type: Opaque
# A committed development password. Real deployments source this from an
# external secret manager (Sealed Secrets, External Secrets, SOPS); a Secret is
# only base64-encoded, not encrypted, so committing a real one would be the
# same as committing plaintext.
stringData:
  password: postgres
  database-url: postgres://postgres:postgres@pokedex-postgres:5432/pokedex?sslmode=disable
