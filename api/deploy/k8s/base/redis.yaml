# Redis holds the state that must be shared between API replicas.
#
# No persistence is configured, and that is deliberate: everything stored here
# is rate-limiting state with a ten-minute TTL. Losing it on a restart means a
# brief window where clients get a fresh allowance, which is a far cheaper
# failure than the disk and backup machinery persistence would require.
apiVersion: v1
kind: Service
metadata:
  name: pokedex-redis
  labels:
    app.kubernetes.io/name: pokedex-redis
spec:
  selector:
    app.kubernetes.io/name: pokedex-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pokedex-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pokedex-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pokedex-redis
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          args:
            - redis-server
            # Append-only file off: the data is disposable by design.
            - --appendonly
            - 'no'
            - --save
            - ''
            # A hard memory ceiling with LRU eviction, so a flood of distinct
            # client addresses cannot grow the keyspace until the pod is
            # OOM-killed. Evicting the oldest bucket is an acceptable loss.
            - --maxmemory
            - 64mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
