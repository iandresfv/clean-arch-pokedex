# NodePort so `minikube service` can reach the API without an ingress
# controller installed.
apiVersion: v1
kind: Service
metadata:
  name: pokedex-api-nodeport
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: pokedex-api
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
