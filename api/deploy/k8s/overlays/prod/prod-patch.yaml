apiVersion: apps/v1
kind: Deployment
metadata:
  name: pokedex-api
spec:
  template:
    spec:
      # Spread replicas across nodes so losing one node does not take the whole
      # service with it.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: pokedex-api
      containers:
        - name: api
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
