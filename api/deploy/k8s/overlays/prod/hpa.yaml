# Requires the metrics-server addon:
#   minikube addons enable metrics-server
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pokedex-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pokedex-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      # React quickly to load, but not to a single noisy sample.
      stabilizationWindowSeconds: 30
    scaleDown:
      # Scale in slowly: removing capacity during a lull that turns out to be
      # temporary causes a second scale-up and a cold cache on every new pod.
      stabilizationWindowSeconds: 300
