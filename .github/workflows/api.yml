name: API CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'

# A new push to the same branch cancels the previous run: only the latest
# commit's result is meaningful.
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: api

env:
  GO_VERSION: '1.26'

jobs:
  quality:
    name: Build, vet and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify dependencies are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          working-directory: api

  generated-code:
    name: Generated code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      # Generated query code is committed. If regenerating changes anything,
      # the committed copy is stale and the build must fail rather than run
      # against a schema that no longer matches.
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: Verify sqlc output is up to date
        run: |
          cd sqlc && sqlc diff

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pokedex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      # The race detector catches unsynchronised concurrent access that normal
      # runs hide. It is too slow for the local loop and belongs here.
      - name: Test with race detector
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pokedex_test?sslmode=disable
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: api/coverage.out
          if-no-files-found: ignore
